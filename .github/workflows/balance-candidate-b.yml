name: Balance candidate B

on:
  push:
    branches: [main]
    paths:
      - "simulation/analysis/balance_candidate_b.cjs"
      - ".github/workflows/balance-candidate-b.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - players: 2
            group: together
          - players: 3
            group: together
          - players: 4
            group: together
          - players: 4
            group: split
          - players: 4
            group: dynamic
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node simulation/analysis/balance_candidate_b.cjs ${{ matrix.players }} ${{ matrix.group }} 256 ST-NEUTRAL
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-b-${{ matrix.players }}-${{ matrix.group }}
          path: simulation/analysis/candidate-b/${{ matrix.players }}-${{ matrix.group }}-ST-NEUTRAL.json
