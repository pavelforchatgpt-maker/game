name: Candidate B stage sensitivity

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/candidate-b-stage-sensitivity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { players: 2, group: together, st: ST-MODERATE }
          - { players: 3, group: together, st: ST-MODERATE }
          - { players: 4, group: split, st: ST-MODERATE }
          - { players: 4, group: dynamic, st: ST-MODERATE }
          - { players: 2, group: together, st: ST-HARSH }
          - { players: 3, group: together, st: ST-HARSH }
          - { players: 4, group: split, st: ST-HARSH }
          - { players: 4, group: dynamic, st: ST-HARSH }
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node simulation/analysis/candidate_b_validation.cjs ${{ matrix.players }} ${{ matrix.group }} 256 ${{ matrix.st }}
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-b-stage-${{ matrix.players }}-${{ matrix.group }}-${{ matrix.st }}
          path: simulation/analysis/candidate-b-validation/${{ matrix.players }}-${{ matrix.group }}-${{ matrix.st }}.json
