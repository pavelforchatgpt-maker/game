name: Fast policy search V3

on:
  push:
    branches: [main]
    paths:
      - "simulation/v3/fast_policy_search.cjs"
      - ".github/workflows/fast-policy-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    strategy:
      fail-fast: false
      matrix:
        include:
          - players: 2
            group: together
          - players: 3
            group: together
          - players: 4
            group: together
          - players: 4
            group: split
          - players: 4
            group: dynamic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node simulation/v3/fast_policy_search.cjs ${{ matrix.players }} ${{ matrix.group }}
      - uses: actions/upload-artifact@v4
        with:
          name: fast-v3-${{ matrix.players }}-${{ matrix.group }}
          path: simulation/v3/fast-results/${{ matrix.players }}-${{ matrix.group }}.json
