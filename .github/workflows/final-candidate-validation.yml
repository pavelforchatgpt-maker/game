name: Final candidate validation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/final-candidate-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node simulation/analysis/final_candidate_validation.cjs 2 together ST-NEUTRAL 512
      - uses: actions/upload-artifact@v4
        with: { name: final-candidate-p2, path: simulation/analysis/final-candidate-validation/*.json }
  p3:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node simulation/analysis/final_candidate_validation.cjs 3 together ST-NEUTRAL 512
      - uses: actions/upload-artifact@v4
        with: { name: final-candidate-p3, path: simulation/analysis/final-candidate-validation/*.json }
  p4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node simulation/analysis/final_candidate_validation.cjs 4 dynamic ST-NEUTRAL 512
      - uses: actions/upload-artifact@v4
        with: { name: final-candidate-p4, path: simulation/analysis/final-candidate-validation/*.json }
  p4-moderate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node simulation/analysis/final_candidate_validation.cjs 4 dynamic ST-MODERATE 192
      - uses: actions/upload-artifact@v4
        with: { name: final-candidate-p4-moderate, path: simulation/analysis/final-candidate-validation/*.json }
  p4-harsh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node simulation/analysis/final_candidate_validation.cjs 4 dynamic ST-HARSH 192
      - uses: actions/upload-artifact@v4
        with: { name: final-candidate-p4-harsh, path: simulation/analysis/final-candidate-validation/*.json }
