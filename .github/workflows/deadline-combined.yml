name: Combined scaling deadline CDF

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deadline-combined.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node simulation/analysis/deadline_cdf.cjs 2 together -2 1 128
      - uses: actions/upload-artifact@v4
        with: { name: deadline-combined-p2, path: simulation/analysis/deadline-cdf/*.json }
  p3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node simulation/analysis/deadline_cdf.cjs 3 together -1 1 128
      - uses: actions/upload-artifact@v4
        with: { name: deadline-combined-p3, path: simulation/analysis/deadline-cdf/*.json }
