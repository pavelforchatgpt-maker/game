name: Candidate C validation

on:
  push:
    branches: [main]
    paths:
      - "simulation/analysis/candidate_c_validation.cjs"
      - ".github/workflows/candidate-c-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - players: 2
            group: together
          - players: 3
            group: together
          - players: 4
            group: split
          - players: 4
            group: dynamic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node simulation/analysis/candidate_c_validation.cjs ${{ matrix.players }} ${{ matrix.group }} 1024
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-c-${{ matrix.players }}-${{ matrix.group }}
          path: simulation/analysis/candidate-c-validation/${{ matrix.players }}p-${{ matrix.group }}.json
