name: Exact capital scaling audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capital-scaling-exact.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node simulation/analysis/capital_probability_scaling.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: capital-scaling-exact
          path: simulation/analysis/capital-scaling/exact.json
          if-no-files-found: error
