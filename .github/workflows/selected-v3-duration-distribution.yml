name: Selected V3 duration distribution
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/selected-v3-duration-distribution.yml"
      - "simulation/analysis/selected_duration_distribution.cjs"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  duration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { players: 2, group: together }
          - { players: 3, group: together }
          - { players: 4, group: split }
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node simulation/analysis/selected_duration_distribution.cjs ${{ matrix.players }} ${{ matrix.group }} 512
      - uses: actions/upload-artifact@v4
        with:
          name: selected-duration-${{ matrix.players }}-${{ matrix.group }}
          path: simulation/analysis/selected-duration-distribution/*.json
