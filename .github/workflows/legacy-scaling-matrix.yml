name: Legacy policy scaling matrix

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/legacy-scaling-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 2p baseline
        run: node simulation/analysis/legacy_scaling_counterfactual.cjs 2 0 0 96
      - name: 2p capital scaling
        run: node simulation/analysis/legacy_scaling_counterfactual.cjs 2 -2 0 96
      - name: 2p movement
        run: node simulation/analysis/legacy_scaling_counterfactual.cjs 2 0 1 96
      - name: 2p both
        run: node simulation/analysis/legacy_scaling_counterfactual.cjs 2 -2 1 96
      - name: 3p baseline
        run: node simulation/analysis/legacy_scaling_counterfactual.cjs 3 0 0 96
      - name: 3p capital scaling
        run: node simulation/analysis/legacy_scaling_counterfactual.cjs 3 -1 0 96
      - name: 3p movement
        run: node simulation/analysis/legacy_scaling_counterfactual.cjs 3 0 1 96
      - name: 3p both
        run: node simulation/analysis/legacy_scaling_counterfactual.cjs 3 -1 1 96
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-scaling-all
          path: simulation/analysis/legacy-scaling/*.json
          if-no-files-found: error
