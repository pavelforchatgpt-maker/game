name: Legacy policy scaling matrix\n\non:\n  push:\n    branches: [main]\n    paths:\n      - ".github/workflows/legacy-scaling-matrix.yml"\n  workflow_dispatch:\n\npermissions:\n  contents: read\n\njobs:\n  compare:\n    runs-on: ubuntu-latest\n    timeout-minutes: 15\n    strategy:\n      fail-fast: false\n      matrix:\n        include:\n          - { players: 2, shift: 0, move: 0, label: p2-base }\n          - { players: 2, shift: -2, move: 0, label: p2-cap }\n          - { players: 2, shift: 0, move: 1, label: p2-move }\n          - { players: 2, shift: -2, move: 1, label: p2-both }\n          - { players: 3, shift: 0, move: 0, label: p3-base }\n          - { players: 3, shift: -1, move: 0, label: p3-cap }\n          - { players: 3, shift: 0, move: 1, label: p3-move }\n          - { players: 3, shift: -1, move: 1, label: p3-both }\n    steps:\n      - uses: actions/checkout@v4\n      - uses: actions/setup-node@v4\n        with:\n          node-version: "22"\n      - run: node simulation/analysis/legacy_scaling_counterfactual.cjs ${{ matrix.players }} ${{ matrix.shift }} ${{ matrix.move }} 128\n      - uses: actions/upload-artifact@v4\n        with:\n          name: legacy-scaling-${{ matrix.label }}\n          path: simulation/analysis/legacy-scaling/*.json\n          if-no-files-found: error\n