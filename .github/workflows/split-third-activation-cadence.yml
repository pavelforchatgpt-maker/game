name: Four-player split third-activation cadence

on:
  push:
    branches: [main]
    paths:
      - "simulation/analysis/split_third_activation_cadence.cjs"
      - ".github/workflows/split-third-activation-cadence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - cadence: 1
            shift: -1
          - cadence: 2
            shift: -1
          - cadence: 3
            shift: -1
          - cadence: 4
            shift: -1
          - cadence: 1
            shift: -2
          - cadence: 2
            shift: -2
          - cadence: 3
            shift: -2
          - cadence: 4
            shift: -2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node simulation/analysis/split_third_activation_cadence.cjs ${{ matrix.cadence }} ${{ matrix.shift }} 512
      - uses: actions/upload-artifact@v4
        with:
          name: split-third-c${{ matrix.cadence }}-s${{ matrix.shift }}
          path: simulation/analysis/split-third-activation-cadence/c${{ matrix.cadence }}-s${{ matrix.shift }}.json
