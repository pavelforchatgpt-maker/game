name: Simulation V3 policy search

on:
  push:
    branches: [main]
    paths:
      - "simulation/v3/**"
      - ".github/workflows/simulation-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - players: 2
            group: together
          - players: 3
            group: together
          - players: 4
            group: together
          - players: 4
            group: split
          - players: 4
            group: dynamic
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run V3 DAG policy search
        run: node simulation/v3/policy_search.cjs ${{ matrix.players }} ${{ matrix.group }}

      - name: Upload V3 result
        uses: actions/upload-artifact@v4
        with:
          name: v3-${{ matrix.players }}-${{ matrix.group }}
          path: simulation/v3/results/${{ matrix.players }}-${{ matrix.group }}.json
          if-no-files-found: error
