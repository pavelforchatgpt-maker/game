name: Deadline extension diagnostic

on:
  push:
    branches: [main]
    paths:
      - "simulation/analysis/deadline_extension.cjs"
      - ".github/workflows/deadline-extension.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - players: 2
            group: together
          - players: 3
            group: together
          - players: 4
            group: split
          - players: 4
            group: dynamic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node simulation/analysis/deadline_extension.cjs ${{ matrix.players }} ${{ matrix.group }} 512
      - uses: actions/upload-artifact@v4
        with:
          name: deadline-${{ matrix.players }}-${{ matrix.group }}
          path: simulation/analysis/deadline-extension/${{ matrix.players }}-${{ matrix.group }}.json
