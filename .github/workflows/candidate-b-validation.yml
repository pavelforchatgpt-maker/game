name: Candidate B validation

on:
  push:
    branches: [main]
    paths:
      - "simulation/analysis/candidate_b_validation.cjs"
      - ".github/workflows/candidate-b-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { players: 2, group: together }
          - { players: 3, group: together }
          - { players: 4, group: together }
          - { players: 4, group: split }
          - { players: 4, group: dynamic }
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node simulation/analysis/candidate_b_validation.cjs ${{ matrix.players }} ${{ matrix.group }} 512 ST-NEUTRAL
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-b-validation-${{ matrix.players }}-${{ matrix.group }}
          path: simulation/analysis/candidate-b-validation/${{ matrix.players }}-${{ matrix.group }}-ST-NEUTRAL.json
