name: Action economy plus capital scaling grid

on:
  push:
    branches: [main]
    paths:
      - "simulation/analysis/action_capital_grid.cjs"
      - ".github/workflows/action-capital-grid.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - players: 2
            group: together
            shift: -1
          - players: 2
            group: together
            shift: -2
          - players: 2
            group: together
            shift: -3
          - players: 3
            group: together
            shift: -1
          - players: 3
            group: together
            shift: -2
          - players: 3
            group: together
            shift: -3
          - players: 4
            group: split
            shift: -1
          - players: 4
            group: split
            shift: -2
          - players: 4
            group: split
            shift: -3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node simulation/analysis/action_capital_grid.cjs ${{ matrix.players }} ${{ matrix.group }} ${{ matrix.shift }} 512
      - uses: actions/upload-artifact@v4
        with:
          name: action-capital-${{ matrix.players }}p-${{ matrix.group }}-${{ matrix.shift }}
          path: simulation/analysis/action-capital-grid/${{ matrix.players }}p-${{ matrix.group }}-shift${{ matrix.shift }}.json
